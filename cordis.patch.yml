# Profile patch layer shipped by dsh-acp-agent-loop: disable the stock loop
# (the registry accepts exactly one agent factory) and insert the dispatcher.
# Override the acp-agent-loop row in your profile's own cordis.patch.yml to
# change the agents list; an id-targeted patch REPLACES the whole config block.
#
# The claude-code entry sets no ANTHROPIC_API_KEY: the adapter falls back to
# the machine's Claude Code login (~/.claude credentials). Export the key into
# the entry's env instead to pin API-key auth.
- id: agent-loop
  disabled: true
- insert:
    - id: acp-agent-loop
      name: dsh-acp-agent-loop
      config:
        agents:
          - name: claude-code
            command: npx
            args: ['-y', '@agentclientprotocol/claude-agent-acp']
            permission: allow
            models:
              - id: default
                name: Claude Code (agent default)
        loop: {}
