# Profile patch layer shipped by dsh-acp-agent-loop: disable the stock loop
# (the registry accepts exactly one agent factory) and insert the dispatcher.
# Edit the agents list in your profile's own cordis.patch.yml to add entries;
# an id-targeted patch REPLACES the whole config block.
- id: agent-loop
  disabled: true
- insert:
    - id: acp-agent-loop
      name: dsh-acp-agent-loop
      config:
        agents:
          - name: claude-code
            command: npx
            args: ['@zed-industries/claude-code-acp']
            permission: reject
            env:
              ANTHROPIC_API_KEY: !!js process.env.ANTHROPIC_API_KEY ?? ''
            models:
              - id: default
                name: Claude Code (agent default)
        loop: {}
